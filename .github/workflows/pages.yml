name: Build & Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Path A (default): GitHub's preinstalled Jekyll environment
      - name: Build with Jekyll (preinstalled)
        if: ${{ hashFiles('Gemfile.lock') == '' }}
        uses: actions/jekyll-build-pages@v1
        env:
          JEKYLL_ENV: production
        with:
          source: ./
          destination: ./_site

      # Path B (auto): Custom build if Gemfile.lock exists (supports custom plugins)
      - name: Set up Ruby
        if: ${{ hashFiles('Gemfile.lock') != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Bundle install
        if: ${{ hashFiles('Gemfile.lock') != '' }}
        run: bundle install --path vendor/bundle

      - name: Jekyll build (custom)
        if: ${{ hashFiles('Gemfile.lock') != '' }}
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -s ./ -d ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4